<header class="site-header">
  <div class="container header-inner">
    <a href="#top" class="brand" aria-label="{{ site.author.name }} — home">
      <img class="brand-mark" src="assets/img/brand-logo-64.png" alt="" width="36" height="36">
      <span class="brand-name">{{ site.author.name }}</span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="#about">About</a>
      <a href="#playbook">Playbook</a>
      <a href="#case-studies">Case Studies</a>
      <a href="#experience">Experience</a>
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
    </nav>
    <div class="header-actions">
      <button class="icon-link" type="button" data-contact-open data-inquiry-type="Portfolio inquiry" aria-label="Send me a message" title="Send me a message">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><defs><mask id="mailIconMask"><rect width="24" height="24" fill="#fff"/><rect x="4" y="6.5" width="16" height="11" rx="1.5" fill="#000"/><path d="M4.8 7.6 12 12.8l7.2-5.2" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></mask></defs><rect width="24" height="24" rx="1.75" fill="currentColor" mask="url(#mailIconMask)"/></svg>
      </button>
      <a class="icon-link" href="{{ site.author.linkedin }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile (opens in a new tab)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>
      </a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode">
        <svg class="theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
      <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobileNav">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
  <div class="scroll-progress" aria-hidden="true"><span id="scrollProgress"></span></div>
</header>

<div class="mobile-nav-overlay" id="mobileNavOverlay"></div>
<nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation">
  <a href="#about">About</a>

</nav>
